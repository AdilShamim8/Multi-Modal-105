# Security gates: secrets, dependencies, code, and containers.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # weekly deep scan, Monday 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the auditor (isolated from the audited set)
        run: pip install pip-audit
      - name: Resolve the full runtime dependency set (CPU wheels)
        run: |
          python -m venv .audit-env
          .audit-env/bin/pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          .audit-env/bin/pip install ".[t2i,t2v,serving]"
      - name: Audit every pinned package in the resolved environment
        run: |
          # freeze emits exactly the resolved tree (auditor excluded: it
          # lives in the runner env, not .audit-env). CPU wheels carry a
          # +cpu local version label PyPI does not know; strip it — the
          # base version maps to the same upstream release.
          .audit-env/bin/pip freeze \
            | grep -E '^[a-zA-Z0-9_.-]+==' \
            | sed -E 's/(==[0-9][^+]+)\+.*/\1/' > audit-env.txt
          echo "auditing $(wc -l < audit-env.txt) pinned packages"
          pip-audit --disable-pip --no-deps --strict -r audit-env.txt

  codeql:
    name: codeql (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: trivy (filesystem + config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
