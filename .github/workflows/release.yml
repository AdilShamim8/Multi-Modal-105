# Release pipeline: tag push → sdist/wheel → container images → GitHub Release.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-dist:
    name: build python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  containers:
    name: build & push images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: deployments/docker/Dockerfile.api
          - image: worker
            dockerfile: deployments/docker/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multimodal-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/multimodal-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: [build-dist, containers]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog section for this tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          awk -v tag="${TAG#v}" '
            $0 ~ "^## \\[" tag "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See commit history for ${TAG}." > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: true
