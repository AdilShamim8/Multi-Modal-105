# Keep dependencies fresh; security updates are auto-PR'd immediately.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage"]
    groups:
      torch-family:
        patterns: ["torch", "torchvision", "torchaudio"]
      dev-tools:
        patterns: ["ruff*", "mypy", "pytest*", "pre-commit"]
    ignore:
      # Major torch upgrades need CUDA matrix validation; manual cadence.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci", "dependencies"]
    groups:
      actions-minor:
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: docker
    directory: "/deployments/docker"
    schedule:
      interval: weekly
    labels: ["containers", "dependencies"]

  - package-ecosystem: terraform
    directory: "/deployments/terraform"
    schedule:
      interval: monthly
    labels: ["infra", "dependencies"]
