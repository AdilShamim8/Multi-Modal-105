# ServiceAccount + RBAC: least privilege for the API tier.
# Referenced by 10-api-deployment.yaml. No wildcard verbs, no secrets read
# beyond the explicit binding — the NetworkPolicies assume this exists.
# Last audited: 2026-10-18
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multimodal-api
  namespace: multimodal
  labels:
    app.kubernetes.io/name: multimodal
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multimodal-api
  namespace: multimodal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]   # readiness-aware routing needs pod state
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get"]                    # read-only scale visibility
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multimodal-api
  namespace: multimodal
subjects:
  - kind: ServiceAccount
    name: multimodal-api
    namespace: multimodal
roleRef:
  kind: Role
  name: multimodal-api
  apiGroup: rbac.authorization.k8s.io
