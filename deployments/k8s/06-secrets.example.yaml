# Secret TEMPLATE — copy to 06-secrets.yaml (gitignored), fill real values,
# and prefer `kubectl create secret` / external-secrets in real deployments.
# NEVER commit the filled file. Pre-commit + CI secret scans enforce this.
apiVersion: v1
kind: Secret
metadata:
  name: multimodal-secrets
  namespace: multimodal
  labels:
    app.kubernetes.io/name: multimodal
type: Opaque
stringData:
  # Comma-separated list of issued API keys (rotated quarterly).
  MM_API_KEYS: "REPLACE_WITH_REAL_KEYS"
  # S3 credentials for the artifact store (IAM role preferred over keys).
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # Redis auth (if enabled on the redis deployment).
  MM_REDIS_PASSWORD: "REPLACE_ME"
