# Observability namespace — hosts Prometheus, Grafana, Alertmanager, and
# the OTel collector that API/worker traces flow to.
# kubectl apply -f deployments/k8s/observability-namespace.yaml
# Last audited: 2026-10-18
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: generation-platform
  annotations:
    owner: "platform-eng"
    note: "multimodal pods scrape these targets; netpol allows this namespace → API /metrics"
