# Redis: the platform's only stateful hot-path component.
# AOF always + replica for failover; exporter scraped by Prometheus.
# Production alternative: Redis Enterprise / ElastiCache with the same URL
# contract — the app only ever sees MM_REDIS_URL (ADR-003).
# Last audited: 2026-10-18
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: multimodal
  labels:
    app.kubernetes.io/name: multimodal
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multimodal
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multimodal
        app.kubernetes.io/component: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      priorityClassName: generation-critical
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"                     # durability: queued jobs survive restart
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - noeviction                # NEVER evict job hashes under pressure
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2.5Gi" }
          volumeMounts:
            - name: data
              mountPath: /data
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          ports:
            - containerPort: 9121
              name: metrics
      volumes:
        - name: data
          emptyDir: {}      # dev baseline; swap for PVC + replica in prod tiers
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: multimodal
  labels:
    app.kubernetes.io/name: multimodal
    app.kubernetes.io/component: redis
spec:
  clusterIP: None           # headless: workers connect to the pod directly
  selector:
    app.kubernetes.io/name: multimodal
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
