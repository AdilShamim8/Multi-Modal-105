# Namespace and labels — the foundation every other manifest selects on.
# Apply order matters: namespace first, then config/secrets, then workloads.
# kubectl apply -f deployments/k8s/00-namespace.yaml
# Last audited: 2026-10-18
apiVersion: v1
kind: Namespace
metadata:
  name: multimodal
  labels:
    app.kubernetes.io/name: multimodal
    app.kubernetes.io/part-of: generation-platform
    app.kubernetes.io/version: "1.0.0"
    environment: production
  annotations:
    owner: "platform-eng"
    runbook: "docs/operations/runbook.md"
