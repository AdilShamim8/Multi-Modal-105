# Prometheus scrape configuration — matches the metric contract in
# src/multimodal/serving/metrics.py and the pod annotations in k8s manifests.
# Last audited: 2026-10-18

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: multimodal
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── API pods (annotated discovery, per-replica series) ───────────────────
  - job_name: multimodal-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [multimodal]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: component

  # ── Workers (metrics sidecar on 9102) ────────────────────────────────────
  - job_name: multimodal-worker
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [multimodal]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: keep
        regex: worker
      - source_labels: [__meta_kubernetes_pod_ready_phase]
        action: keep
        regex: "True"

  # ── Infrastructure ───────────────────────────────────────────────────────
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.kube-system.svc:8080"]
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):.*"
        replacement: "${1}:9100"
        target_label: __address__
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter.multimodal.svc:9121"]
