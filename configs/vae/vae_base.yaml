# VAE — KL-regularized autoencoder pretraining (the T2I/T2V compression stage).
# Inherits: ../base.yaml
__base__: ../base.yaml

experiment_name: vae-kl-base
output_dir: ${MM_OUTPUT_DIR:./outputs/vae_base}

# ── Architecture ────────────────────────────────────────────────────────────
in_channels: 3
latent_channels: 4
base_channels: 128
channel_multipliers: [1, 2, 4, 8]
num_res_blocks: 2
attention_resolutions: [16]
dropout: 0.0
image_size: 256

# ── Training ────────────────────────────────────────────────────────────────
batch_size: 8
num_epochs: 100
kl_weight: 1.0e-6
perceptual_weight: 1.0
adversarial_weight: 0.5
disc_start_step: 50001

optimizer:
  learning_rate: 4.5e-6
  warmup_steps: 0
  scheduler: cosine
