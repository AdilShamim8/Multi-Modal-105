# T2V — 32-frame variant over the causal 3D VAE.
# Inherits: dit_video_base.yaml chain. Latents: (4, 8, 32, 32).
__base__: dit_video_base.yaml

experiment_name: t2v-dit-video-32f
output_dir: ${MM_OUTPUT_DIR:./outputs/t2v_32f}

num_frames: 32
frame_size: 256
fps: 8

# Temporal attention cost grows with T — deeper factorization pays off.
temporal_depth: 6
temporal_heads: 8

# Memory regime: 32-frame clips roughly double activation footprint.
batch_size: 1
gradient_accumulation_steps: 16      # hold effective batch at 16
activation_offload: ${MM_T2V_OFFLOAD:true}

optimizer:
  learning_rate: 4.0e-5
  warmup_steps: 3000
  num_training_steps: 1000000
