# T2V — factorized space-time DiT over causal 3D-VAE latents.
# Inherits: ../base.yaml
__base__: ../base.yaml

experiment_name: t2v-dit-video-base
output_dir: ${MM_OUTPUT_DIR:./outputs/t2v_base}

# ── Clip geometry ───────────────────────────────────────────────────────────
num_frames: 16
frame_size: 256
fps: 8
max_video_length: 10.0

# ── Noise schedule ──────────────────────────────────────────────────────────
num_train_timesteps: 1000
beta_schedule: scaled_linear
prediction_type: v_prediction

# ── Video DiT ───────────────────────────────────────────────────────────────
dit_patch_size: 2
dit_depth: 28
dit_hidden_size: 1152
dit_num_heads: 16
temporal_attention: true
temporal_heads: 8
temporal_depth: 4
rope_3d: true

# ── Compression network (causal 3D VAE) ─────────────────────────────────────
video_vae_path: ${MM_T2V_VAE_PATH:./checkpoints/video_vae}
temporal_compression: 4
spatial_compression: 8

# ── Memory-constrained regime ───────────────────────────────────────────────
image_size: 256
latent_size: 32
batch_size: 1
gradient_accumulation_steps: 8
num_train_steps: 1000000
gradient_checkpointing: true
activation_offload: ${MM_T2V_OFFLOAD:false}

# ── Latent caching (the large-scale training unlock) ────────────────────────
latent_caching: true
latent_cache_dir: ${MM_T2V_CACHE_DIR:./latent_cache}

# ── Data curation ───────────────────────────────────────────────────────────
video_data_root: ${MM_T2V_DATA_ROOT:./data/webvid}
min_resolution: 256
max_resolution: 1024
min_motion_score: 0.15

optimizer:
  learning_rate: 5.0e-5
  warmup_steps: 2000
  num_training_steps: 1000000
