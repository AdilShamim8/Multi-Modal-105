# Evaluation suite — IS / FID / CLIP-score / diversity against a reference set.
# Consumed by: mma evaluate --config configs/eval/default.yaml
# Last audited: 2026-10-18.

experiment_name: eval-default
output_dir: ${MM_OUTPUT_DIR:./outputs/eval}

sample:
  num_inference_steps: 30
  guidance_scale: 7.5
  sampler: dpm++
  num_samples: 10000          # 10k samples: FID stabilizes ±0.3
  seed: 42
  batch_size: 16

metrics:
  inception_score:
    splits: 10
  fid:
    reference_dir: ${MM_EVAL_REFERENCE:./data/eval_reference}
    feature_layer: pool3       # standard 2048-d inception features
  clip_score:
    model: ViT-B/32
  diversity:
    lpips_net: vgg
    pairs: 5000

report:
  format: markdown             # markdown | json | both
  include_timing: true
  thresholds:                  # release gates (docs/operations/slos.md)
    fid_max: 25.0
    is_min: 8.0
    clip_min: 0.25
