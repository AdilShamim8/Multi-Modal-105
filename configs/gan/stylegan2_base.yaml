# GAN — StyleGAN2 at 256px (adversarial synthesis track).
# Inherits: ../base.yaml
__base__: ../base.yaml

experiment_name: stylegan2-256
output_dir: ${MM_OUTPUT_DIR:./outputs/stylegan2}

# ── Shared geometry ─────────────────────────────────────────────────────────
img_resolution: 256
img_channels: 3

# ── Generator ───────────────────────────────────────────────────────────────
z_dim: 512
w_dim: 512
mapping_num_layers: 8
mapping_lr_mul: 0.01
channel_base: 32768
channel_max: 512
synthesis_lr_mul: 1.0

# ── Discriminator ───────────────────────────────────────────────────────────
mbstd_group_size: 4

# ── Adversarial objective ───────────────────────────────────────────────────
loss_type: softplus             # "softplus" | "hinge" | "wgan-gp"
r1_gamma: 10.0
lazy_reg_interval: 16
gp_lambda: 10.0

# ── Optimization (StyleGAN2 defaults) ───────────────────────────────────────
batch_size: 32
num_epochs: 100
gen_lr: 2.0e-3
disc_lr: 2.0e-3
beta1: 0.0
beta2: 0.99
num_train_steps: 2000000

# ── Stability ───────────────────────────────────────────────────────────────
ema_beta: 0.999
style_mixing_prob: 0.9

optimizer:
  optimizer: adam
  learning_rate: 2.0e-3
  beta1: 0.0
  beta2: 0.99
  warmup_steps: 0
